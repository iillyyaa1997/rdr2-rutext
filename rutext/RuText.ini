[RuText]
; 0 = pass all text through unchanged
Enabled=1
; 1 = write English strings that reached the screen without a translation
;     to RuText\untranslated\<module>.txt
Capture=1

[HideoutMemory]
; 1 = keep Bandit Hideouts skulls hidden until you have been near the hideout, then keep them shown
;     (needs ALWAYS_SHOW_HIDEOUT_BLIP=1 in Bandit_Hideouts.ini)
Enabled=1
; metres: how close you have to come for a hideout to count as visited
Radius=150
; 1 = log every distinct native the hideout module calls (troubleshooting)
Diag=0
